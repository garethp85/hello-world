<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skills Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Skills Tracker</h1>
    <nav class="tabs" role="tablist">
      <button role="tab" data-view="matrix" aria-selected="true">Matrix</button>
      <button role="tab" data-view="coverage">Coverage</button>
      <button role="tab" data-view="manage">Manage</button>
    </nav>
    <a class="export" href="/api/export.csv">Export CSV</a>
  </header>

  <main>
    <section id="view-matrix" class="view">
      <div class="toolbar">
        <input id="search" type="search" placeholder="Filter engineers or skills…" aria-label="Filter">
        <select id="team-filter" aria-label="Team"><option value="">All teams</option></select>
        <select id="category-filter" aria-label="Category"><option value="">All categories</option></select>
        <label class="inline">Min level
          <select id="min-level">
            <option value="0">Any</option>
            <option value="1">1+</option><option value="2">2+</option>
            <option value="3">3+</option><option value="4">4+</option><option value="5">5</option>
          </select>
        </label>
      </div>
      <p class="hint">Click a cell to set a level. Shift-click toggles “wants to learn” (★).</p>
      <div class="legend" id="legend"></div>
      <div class="matrix-wrap"><table id="matrix" class="matrix"></table></div>
      <p id="matrix-empty" class="empty" hidden>Add some engineers and skills on the <b>Manage</b> tab to get started.</p>
    </section>

    <section id="view-coverage" class="view" hidden>
      <p class="hint">Bus factor = number of engineers at level 3 (Competent) or above. Anything at 0–1 is a risk.</p>
      <div class="cards" id="coverage-stats"></div>
      <table class="list" id="coverage"></table>
    </section>

    <section id="view-manage" class="view" hidden>
      <div class="manage-grid">
        <div class="panel">
          <h2>Engineers</h2>
          <form id="engineer-form" class="row-form">
            <input name="name" placeholder="Name" required maxlength="100">
            <input name="team" placeholder="Team" maxlength="100" list="team-list">
            <input name="role" placeholder="Role" maxlength="100">
            <button type="submit">Add</button>
          </form>
          <datalist id="team-list"></datalist>
          <ul class="items" id="engineer-list"></ul>
        </div>
        <div class="panel">
          <h2>Skills</h2>
          <form id="skill-form" class="row-form">
            <input name="name" placeholder="Skill" required maxlength="100">
            <input name="category" placeholder="Category" maxlength="100" list="category-list">
            <button type="submit">Add</button>
          </form>
          <datalist id="category-list"></datalist>
          <ul class="items" id="skill-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <div id="picker" class="picker" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
